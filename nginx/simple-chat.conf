# Nginx reverse proxy for the Simple Chat app.
# Copy this file to /etc/nginx/sites-available/simple-chat
# Then symlink it to /etc/nginx/sites-enabled/simple-chat.

server {
    listen 80;
    listen [::]:80;

    server_name wywiwyg.net www.wywiwyg.net;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Required for Socket.IO / WebSocket real-time chat.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }
}
